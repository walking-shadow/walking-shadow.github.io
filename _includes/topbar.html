<header class="topbar">
    <div class="wrap">
        <a class="brand" href="#top">{{ site.data.profile.navbar_name }}</a>
        <nav aria-label="Sections">
            {% for item in site.data.navigation.sections %}
            <a href="#{{ item.anchor }}">{{ item.name }}</a>
            {% endfor %}
        </nav>
    </div>
</header>
<script>
    // Mark the section currently in view in the top bar.
    (function () {
        if (!('IntersectionObserver' in window)) return;
        var links = {};
        document.querySelectorAll('.topbar nav a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                for (var id in links) links[id].classList.toggle('current', id === entry.target.id);
            });
        }, { rootMargin: '-45% 0px -50% 0px' });
        document.addEventListener('DOMContentLoaded', function () {
            for (var id in links) { var el = document.getElementById(id); if (el) observer.observe(el); }
        });
    })();
</script>
