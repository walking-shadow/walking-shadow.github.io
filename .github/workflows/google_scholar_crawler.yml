name: Update Google Scholar citations

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Crawl Google Scholar
        run: python google_scholar_crawler/main.py

      - name: Commit results if the citation count changed
        run: |
          if git diff --quiet -- assets/results/gs_data_shieldsio.json; then
            echo "Citation count unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/results/gs_data.json assets/results/gs_data_shieldsio.json
          git commit -m "Update Google Scholar citation data"
          git push
