<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {% assign profile = site.data.profile %}
    <title>{% if page.title %}{{ page.title }} – {{ profile.primary_name }}{% else %}{{ profile.site_title }}{% endif %}</title>
    <meta name="description" content="{{ profile.site_description }}">
    <meta name="author" content="{{ profile.primary_name }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">

    <meta property="og:type" content="profile">
    <meta property="og:title" content="{{ profile.site_title }}">
    <meta property="og:description" content="{{ profile.site_description }}">
    <meta property="og:url" content="{{ site.url }}/">
    <meta property="og:image" content="{{ site.url }}/{{ profile.portrait_url }}">
    <meta name="twitter:card" content="summary">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
            "@type": "Person",
            "name": "{{ profile.primary_name }}",
            "url": "{{ site.url }}/",
            "image": "{{ site.url }}/{{ profile.portrait_url }}",
            "description": "{{ profile.site_description }}",
            "jobTitle": "Ph.D. Student",
            "affiliation": { "@type": "CollegeOrUniversity", "name": "The University of Tokyo" },
            "alumniOf": { "@type": "CollegeOrUniversity", "name": "Nanjing University" },
            "sameAs": [
                "https://scholar.google.com/citations?user={{ profile.gscholar }}",
                "https://github.com/{{ profile.github }}"
            ]
        }
    }
    </script>

    <link rel="preload" href="assets/fonts/source-sans-3.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="shortcut icon" href="assets/images/etc/bitbug_favicon.ico">
</head>

<body>
    {% include topbar.html %}
    <main id="top">
        {{ content }}
    </main>
    {% include footer.html %}
</body>
</html>
